<!DOCTYPE html>
<html lang="de" translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon/favicon-192.png">
    <link rel="apple-touch-icon" href="assets/img/favicon/apple-touch-icon.png">

    <title>Sharkie</title>
</head>


<body onload="init()">

    <h1>Willkommen bei Sharkie</h1>

    <div class="game-container">
        <canvas id="canvas" width="720" height="480"></canvas>

        <div id="startScreen" class="screen start-screen">
            <h2 class="game-title">Sharkie</h2>
            <div class="start-menu">
                <button class="img-btn start-btn" onclick="startGame()" aria-label="Start"></button>
                <button class="text-btn" onclick="showInstructions()">Anleitung</button>
            </div>
            <button class="text-btn legal-link" onclick="showImprint()">Impressum</button>
        </div>

        <dialog id="infoDialog" class="info-dialog" onclick="closeOnBackdrop(event)" aria-labelledby="dialogTitle">
            <div class="info-panel">
                <button class="close-x" onclick="closeDialog()" aria-label="Schließen">&times;</button>
                <div id="dialogContent" class="dialog-content"></div>
            </div>
        </dialog>

        <div id="endScreen" class="screen end-screen d-none">
            <img class="end-title" src="assets/img/6.Botones/Tittles/Game Over/Recurso 9.png" alt="Game over">
            <div class="end-buttons">
                <button class="img-btn try-again-btn" onclick="startGame()" aria-label="Try again"></button>
                <button class="text-btn" onclick="goHome()">Home</button>
            </div>
        </div>

        <button class="mute-btn" onclick="toggleMute()"><img id="muteIcon" class="mute-icon" src="assets/img/6.Botones/volume.png" alt="Ton"></button>
        <button class="mute-btn fullscreen-btn" onclick="toggleFullscreen()" aria-label="Vollbild"><img id="fullscreenIcon" class="mute-icon" src="assets/img/6.Botones/fullscreen.png" alt="Vollbild"></button>
    </div>

    <div id="touchControls" class="touch-controls d-none" oncontextmenu="return false">
        <div class="touch-pad">
            <button class="touch-btn touch-up" data-key="UP" aria-label="Hoch"><img class="touch-arrow" src="assets/img/6.Botones/triangle.png" alt=""></button>
            <button class="touch-btn touch-left" data-key="LEFT" aria-label="Links"><img class="touch-arrow" src="assets/img/6.Botones/triangle.png" alt=""></button>
            <button class="touch-btn touch-right" data-key="RIGHT" aria-label="Rechts"><img class="touch-arrow" src="assets/img/6.Botones/triangle.png" alt=""></button>
            <button class="touch-btn touch-down" data-key="DOWN" aria-label="Runter"><img class="touch-arrow" src="assets/img/6.Botones/triangle.png" alt=""></button>
        </div>
        <div class="touch-actions">
            <button class="touch-btn touch-action" data-key="A" aria-label="Blase schießen">Blase</button>
            <button class="touch-btn touch-action" data-key="SPACE" aria-label="Flossenschlag">Slap</button>
        </div>
    </div>

    <div class="rotate-hint">
        <div class="rotate-phone"></div>
        <p>Bitte dreh dein Gerät ins Querformat</p>
        <p class="rotate-sub">Turn your device to play</p>
    </div>
</body>


<script src="/javascript/models/base/keyboard.class.js"></script>
<script src="/javascript/models/base/geometry.class.js"></script>
<script src="/javascript/models/base/game-intervals.class.js"></script>
<script src="/javascript/models/base/game-audio.class.js"></script>
<script src="/javascript/models/base/movable-object.class.js"></script>
<script src="/javascript/models/hud/animated-bar.class.js"></script>
<script src="/javascript/models/hud/hud-element.class.js"></script>
<script src="/javascript/models/hud/player-hud.class.js"></script>
<script src="/javascript/models/hud/boss-bar.class.js"></script>
<script src="/javascript/models/world/background-objects.class.js"></script>
<script src="/javascript/models/world/barrier.class.js"></script>
<script src="/javascript/models/collectibles/coins.class.js"></script>
<script src="/javascript/models/collectibles/poison-bottle.class.js"></script>
<script src="/javascript/models/entities/character.class.js"></script>
<script src="/javascript/models/entities/pufferfish.class.js"></script>
<script src="/javascript/models/entities/jellyfish.class.js"></script>
<script src="/javascript/models/entities/bubble.class.js"></script>
<script src="/javascript/models/entities/endboss.class.js"></script>
<script src="/javascript/models/world/level.class.js"></script>
<script src="/javascript/levels/level1.js"></script>
<script src="/javascript/models/world/world.class.js"></script>
<script src="/javascript/templates/templates.js"></script>
<script src="/javascript/game.js"></script>
<script src="/javascript/mobile/mobile.js"></script>

</html>
