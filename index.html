<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="img/favicon/favicon-192.png">
    <link rel="apple-touch-icon" href="img/favicon/apple-touch-icon.png">

    <title>Sharkie</title>
</head>


<body onload="init()">

    <h1>Willkommen bei Sharkie</h1>

    <div class="game-container">
        <canvas id="canvas" width="720" height="480"></canvas>

        <div id="startScreen" class="screen start-screen">
            <h2 class="game-title">Sharkie</h2>
            <button class="img-btn start-btn" onclick="startGame()" aria-label="Start"></button>
        </div>

        <div id="endScreen" class="screen end-screen d-none">
            <img class="end-title" src="img/6.Botones/Tittles/Game Over/Recurso 9.png" alt="Game over">
            <div class="end-buttons">
                <button class="img-btn try-again-btn" onclick="startGame()" aria-label="Try again"></button>
                <button class="text-btn" onclick="goHome()">Home</button>
            </div>
        </div>
    </div>
</body>


<script src="/javascript/models/base/keyboard.class.js"></script>

<script src="/javascript/models/hud/player-hud.class.js"></script>
<script src="/javascript/models/hud/boss-bar.class.js"></script>
<script src="/javascript/models/world/background-objects.class.js"></script>

<script src="/javascript/models/collectibles/coins.class.js"></script>

<script src="/javascript/models/entities/character.class.js"></script>
<script src="/javascript/models/entities/pufferfish.class.js"></script>
<script src="/javascript/models/entities/jellyfish.class.js"></script>
<script src="/javascript/models/entities/bubble.class.js"></script>
<script src="/javascript/models/entities/endboss.class.js"></script>
<script src="/javascript/models/world/level.class.js"></script>
<script src="/javascript/levels/level1.js"></script>
<script src="/javascript/models/world/world.class.js"></script>
<script src="/javascript/game.js"></script>

</html>
